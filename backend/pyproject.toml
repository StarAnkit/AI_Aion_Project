[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-aion-backend"
version = "0.1.0"
description = "FastAPI backend for AI_Aion_Project"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "openai>=1.99,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0", "pytest-cov>=6.2,<7.0", "ruff>=0.12,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
